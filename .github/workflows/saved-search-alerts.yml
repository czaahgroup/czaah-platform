name: Saved-search email alerts

# Daily: emails each buyer the new listings that match a saved search they
# switched alerts on for (see src/app/api/property-account/alerts/route.ts).
# Needs CRON_SECRET as a Worker secret and a GitHub repo secret (both set).

on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC
  workflow_dispatch:

concurrency:
  group: saved-search-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          code=$(curl -s -o /tmp/o -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://czaah.com/api/property-account/alerts)
          cat /tmp/o; echo
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }
